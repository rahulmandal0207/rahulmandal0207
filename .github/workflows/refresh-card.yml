# Re-downloads the gh-ascii profile card once a day and commits it only when
# the stats actually changed. Based on the example workflow from
# https://github.com/crafter-station/gh-ascii
#
# GitHub disables scheduled workflows after 60 days without repo activity.
# If the card stops updating, re-enable this workflow from the Actions tab.

name: Refresh gh-ascii card

on:
  schedule:
    # Daily at 06:17 UTC (off-the-hour times are scheduled more reliably).
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-gh-ascii-card
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download both themes
        env:
          HANDLE: rahulmandal0207
          GH_ASCII_URL: https://gh.crafter.run
          COLS: "140"
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            "$GH_ASCII_URL/$HANDLE?theme=dark&cols=$COLS" \
            -o dark_mode.svg
          curl -fsSL --retry 3 --retry-delay 5 \
            "$GH_ASCII_URL/$HANDLE?theme=light&cols=$COLS" \
            -o light_mode.svg

      - name: Commit only if the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if git diff --cached --quiet; then
            echo "Card unchanged, nothing to commit."
          else
            git commit -m "chore: refresh gh-ascii card"
            git push
          fi
